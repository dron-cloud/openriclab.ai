services:
  - type: web
    name: openriclab-ai
    runtime: python
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      - key: OLLAMA_API_KEY
        sync: false

      - key: OLLAMA_MODEL
        value: gpt-oss:20b

      - key: OLLAMA_API_BASE
        value: https://ollama.com/api

      - key: REQUEST_TIMEOUT_SECONDS
        value: "300"

      - key: OLLAMA_NUM_PREDICT
        value: "-1"

      - key: OLLAMA_THINKING
        value: low

      - key: MAX_USER_CHARACTERS
        value: "6000"

      - key: MAX_HISTORY_MESSAGES
        value: "8"

      - key: MAX_HISTORY_CHARACTERS_PER_MESSAGE
        value: "4000"

      - key: RATE_LIMIT_REQUESTS
        value: "30"

      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "600"

      - key: ALLOWED_ORIGINS
        value: https://dron-cloud.github.io