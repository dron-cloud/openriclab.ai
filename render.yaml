services:
  - type: web
    name: wirelessai-copilot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: e4d69918ee184c1c985d6624062ee011.KTKdOj2c9K2nN38l4-nififh
        sync: false
      - key: OLLAMA_MODEL
        value: gpt-oss:20b
      - key: OLLAMA_API_BASE
        value: https://ollama.com/api
      - key: ALLOWED_ORIGINS
        value: https://dron-cloud.github.io
