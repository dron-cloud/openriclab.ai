services:
  - type: web
    name: wirelessai-copilot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: OLLAMA_API_KEY
        sync: false

      - key: OLLAMA_MODEL
        value: gpt-oss:20b

      - key: OLLAMA_API_BASE
        value: https://ollama.com/api

      - key: ALLOWED_ORIGINS
        value: https://dron-cloud.github.io